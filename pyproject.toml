[project]
name = "smart-doc-extractor"
version = "0.1.0"
description = "API que extrae datos estructurados y auditables de PDFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "faker>=30",
    "httpx>=0.28",
    "pillow>=11",
    "pypdfium2>=4.30",
    "pytest>=8.3",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
