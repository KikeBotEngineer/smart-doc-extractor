name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_MODE: recorded # sin red ni API key: respuestas grabadas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas
        run: pytest
      - name: Dataset sintético
        run: python scripts/generate_dataset.py
      - name: Evaluación
        run: python eval/run_eval.py --min-clean-accuracy 0.99 --out eval/report-ci.md
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/report-ci.md
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Imagen
        run: docker build -t smart-doc-extractor .
