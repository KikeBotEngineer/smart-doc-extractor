name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_MODE: recorded # sin red ni API key: respuestas grabadas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
          pip install -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      # Las fallas se publican también como anotaciones: se leen sin descargar el log
      - name: Pruebas
        run: |
          set -o pipefail
          pytest -rfE --tb=line 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | head -10 | sed 's/^/::error title=pytest::/'
            exit 1
          }
      - name: Dataset sintético
        run: python scripts/generate_dataset.py
      - name: Evaluación
        run: |
          set -o pipefail
          python eval/run_eval.py --min-clean-accuracy 0.99 --out eval/report-ci.md 2>&1 \
            | tee eval.log || { tail -3 eval.log | sed 's/^/::error title=eval::/'; exit 1; }
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/report-ci.md
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Imagen
        run: docker build -t smart-doc-extractor .
